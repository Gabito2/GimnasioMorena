<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Gym Morena</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div class="hero">
    <ion-icon aria-hidden="true" name="barbell-outline" class="hero-icon"></ion-icon>
    <h1>Gym Morena</h1>
    <p class="lema">Entrená fuerte · Cobrá a tiempo</p>
  </div>

  <ion-card class="mensaje">
    <ion-card-content>
      <p class="saludo">{{ mensajeDelDia }}</p>
    </ion-card-content>
  </ion-card>

  <div class="resumen">
    <ion-card class="stat">
      <ion-card-content>
        <span class="num">{{ total }}</span>
        <span class="lbl">Socios</span>
      </ion-card-content>
    </ion-card>
    <ion-card class="stat amarillo">
      <ion-card-content>
        <span class="num">{{ porVencer }}</span>
        <span class="lbl">Por vencer</span>
      </ion-card-content>
    </ion-card>
    <ion-card class="stat rojo">
      <ion-card-content>
        <span class="num">{{ vencidos }}</span>
        <span class="lbl">Vencidos</span>
      </ion-card-content>
    </ion-card>
  </div>

  <ion-card class="acciones">
    <ion-card-content>
      <h2>Acciones rápidas</h2>
      <ion-button expand="block" (click)="irRegistrar()">
        <ion-icon slot="start" name="add-circle-outline"></ion-icon>
        Registrar alumno
      </ion-button>
      <ion-button expand="block" fill="outline" (click)="irVencimientos()">
        <ion-icon slot="start" name="alarm-outline"></ion-icon>
        Ver vencimientos
      </ion-button>
      <div class="fila">
        <ion-button expand="block" fill="outline" (click)="irEstadisticas()">
          <ion-icon slot="start" name="stats-chart-outline"></ion-icon>
          Estadísticas
        </ion-button>
        <ion-button expand="block" fill="outline" color="medium" (click)="irBackup()">
          <ion-icon slot="start" name="download-outline"></ion-icon>
          Copia / Datos
        </ion-button>
      </div>
    </ion-card-content>
  </ion-card>
</ion-content>
